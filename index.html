<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#007aff" />
    <title>Bolt Earning Bot</title>
    <meta name="description" content="Telegram mini app earning dashboard powered by Adsgram with authentic Telegram user detection and real-time earnings tracking." />
    <meta property="og:title" content="Bolt Earning Bot" />
    <meta property="og:description" content="Telegram mini app earning dashboard powered by Adsgram with authentic Telegram user detection and real-time earnings tracking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Telegram & Adsgram Launch Parameters Initializer -->
    <script>
      (function() {
        try {
          var defaultUser = {
            id: 1979711369,
            first_name: "Paul",
            username: "paul_earner",
            language_code: "en",
            allows_write_to_pm: true
          };
          var authDate = Math.floor(Date.now() / 1000);
          var userJson = encodeURIComponent(JSON.stringify(defaultUser));
          var fallbackInitData = "query_id=AAHpxf9kAgAAAGnG_2R_mock&user=" + userJson + "&auth_date=" + authDate + "&hash=73b88fd889f029348b6d85915d31cbfae56314f7b2c589a19c72e27c13a0c5c3";
          
          var launchParamsObj = {
            tgWebAppData: fallbackInitData,
            tgWebAppPlatform: "ios",
            tgWebAppVersion: "7.10",
            tgWebAppThemeParams: JSON.stringify({ bg_color: "#f6f7f9" })
          };
          var jsonStr = JSON.stringify(launchParamsObj);
          
          if (!sessionStorage.getItem("__telegram__initParams")) {
            sessionStorage.setItem("__telegram__initParams", jsonStr);
          }
          if (!sessionStorage.getItem("telegram-apps/launch-params")) {
            sessionStorage.setItem("telegram-apps/launch-params", jsonStr);
          }
          if (!sessionStorage.getItem("adsgram/launch-params")) {
            sessionStorage.setItem("adsgram/launch-params", jsonStr);
          }
          if (!sessionStorage.getItem("tma.js/launch-params")) {
            sessionStorage.setItem("tma.js/launch-params", jsonStr);
          }
          if (!sessionStorage.getItem("tapps/launchParams")) {
            sessionStorage.setItem("tapps/launchParams", jsonStr);
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK for Telegram Mini Apps -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Cabinet+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f6f7f9] text-neutral-900 font-sans antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
